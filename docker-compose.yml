version: "3.9"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Neo4j 5.x — Graph database with APOC + GDS plugins
  # Note: For production, swap image to neo4j:5.15-enterprise and supply
  #       NEO4J_ACCEPT_LICENSE_AGREEMENT=yes + a valid license.
  # ─────────────────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.15-community
    container_name: ecg-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/ecg_password123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ecg-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Zookeeper — Required by Kafka
  # ─────────────────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: ecg-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - ecg-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Apache Kafka — Event streaming platform
  # Topics: ecg.deal.created, ecg.deal.status.changed,
  #         ecg.ownership.changed, ecg.risk.flagged, ecg.valuation.updated
  # ─────────────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ecg-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - ecg-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Kafka topic initializer — creates all ECG topics on first boot
  # ─────────────────────────────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ecg-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic ecg.deal.created
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic ecg.deal.status.changed
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic ecg.ownership.changed
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic ecg.risk.flagged
      kafka-topics --create --if-not-exists --bootstrap-server kafka:29092 --partitions 6 --replication-factor 1 --topic ecg.valuation.updated
      echo 'All ECG Kafka topics created.'
      "
    networks:
      - ecg-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Qdrant — Vector similarity search engine for document embeddings
  # ─────────────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: ecg-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecg-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis — Caching layer for query results and session state
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ecg-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ecg-network

  # ─────────────────────────────────────────────────────────────────────────────
  # ECG API — .NET 8 Minimal API (graph query gateway)
  # ─────────────────────────────────────────────────────────────────────────────
  ecg-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecg-api
    ports:
      - "5000:8080"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Neo4j__Uri: bolt://neo4j:7687
      Neo4j__Username: neo4j
      Neo4j__Password: ecg_password123
      Neo4j__Database: neo4j
      Kafka__BootstrapServers: kafka:29092
      Redis__ConnectionString: redis:6379
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecg-network

  # ─────────────────────────────────────────────────────────────────────────────
  # Mock Warehouse API — Python FastAPI serving synthetic financial metrics
  # ─────────────────────────────────────────────────────────────────────────────
  mock-warehouse:
    image: python:3.11-slim
    container_name: ecg-mock-warehouse
    ports:
      - "8090:8090"
    volumes:
      - ./scripts:/app
    working_dir: /app
    command: >
      bash -c "pip install fastapi uvicorn --quiet &&
               uvicorn mock_warehouse_api:app --host 0.0.0.0 --port 8090"
    networks:
      - ecg-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  neo4j_import:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  qdrant_data:
  redis_data:

networks:
  ecg-network:
    driver: bridge
